<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C++ Threading Syntax — Call Flow Diagrams &amp; Full Examples</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#12181f; --grid:#1f2a36; --text:#d7e0ea; --text-dim:#8494a6;
    --accent:#5ee3c7;
    --a-color:#f4a93b; --b-color:#c8534f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',Consolas,monospace;padding:22px;}
  .wrap{max-width:1060px;margin:0 auto;}
  h1{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-weight:500;margin:0 0 4px;}
  h1 span{color:var(--accent);}
  .sub{color:var(--text-dim);font-size:12.5px;max-width:700px;line-height:1.5;margin-bottom:16px;}
  .tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:14px;}
  .tab{background:var(--panel);border:1px solid var(--grid);color:var(--text-dim);padding:7px 11px;font-size:10.5px;letter-spacing:.03em;cursor:pointer;text-transform:uppercase;}
  .tab.active{background:var(--accent);color:#0b0f14;border-color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--grid);border-radius:3px;padding:18px 20px;}
  .scenario h2{font-size:14px;color:var(--text);margin:0 0 4px;font-weight:600;}
  .scenario .desc{color:var(--text-dim);font-size:12px;margin-bottom:14px;line-height:1.5;}
  svg{display:block;width:100%;height:auto;background:#f7f5ef;border-radius:4px;}
  ol.steps{margin:16px 0 4px;padding-left:0;list-style:none;counter-reset:step;}
  ol.steps li{position:relative;padding:6px 0 6px 34px;font-size:12.5px;color:var(--text-dim);line-height:1.5;border-bottom:1px solid var(--grid);}
  ol.steps li:last-child{border-bottom:none;}
  ol.steps li b{color:var(--text);}
  .num{position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#0b0f14;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .note{margin-top:14px;padding:10px 14px;background:#0e141d;border-left:2px solid var(--accent);font-size:12px;color:var(--text-dim);line-height:1.55;}
  .note b{color:var(--accent);}
  code.inline{color:var(--accent);}
  .codewrap{margin-top:16px;}
  .toggle-code{background:#0e141d;border:1px solid var(--grid);color:var(--accent);padding:8px 14px;font-family:inherit;font-size:11.5px;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;width:100%;text-align:left;border-radius:3px;}
  .toggle-code:hover{border-color:var(--accent);}
  pre.fullcode{margin:8px 0 0;padding:16px 18px;background:#080b0f;border:1px solid var(--grid);border-radius:3px;overflow-x:auto;font-size:12px;line-height:1.6;}
  pre.fullcode code{white-space:pre;}
  .c-comment{color:#5c6b7a;font-style:italic;}
  .c-str{color:#e0c46c;}
  .c-std{color:#5ee3c7;}
  .c-kw{color:#f4a93b;}
</style>

<body>
<div class="wrap">
  <h1>C++ Threading Syntax <span>// call-flow diagrams + full examples</span></h1>
  <div class="sub">Each tab: a call-flow diagram (same visual language as your reference), numbered steps, and a complete, realistic, compilable example you can expand.</div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
function e(tag, attrs, text){
  const el = document.createElementNS(NS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  if(text !== undefined) el.textContent = text;
  return el;
}
function addDefs(svg, colors){
  const defs = e('defs', {});
  colors.forEach(c => {
    const m = e('marker', {id:'arrow-'+c.id, markerWidth:9, markerHeight:9, refX:7, refY:4, orient:'auto'});
    m.appendChild(e('path', {d:'M0,0 L8,4 L0,8 Z', fill:c.color}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);
}
function codeBox(svg, {x,y,w,title,titleColor,titleTextColor='#111',lines,bodyColor='#8fd0b9'}){
  const titleH = 34, lineH = 22, pad = 10;
  const h = titleH + lines.length*lineH + pad*2;
  svg.appendChild(e('rect',{x,y,width:w,height:titleH,fill:titleColor,stroke:'#111','stroke-width':2.5}));
  const t = e('text',{x:x+w/2,y:y+titleH/2+5,'text-anchor':'middle','font-size':13.5,'font-weight':700,fill:titleTextColor});
  t.textContent = title;
  svg.appendChild(t);
  svg.appendChild(e('rect',{x,y:y+titleH,width:w,height:h-titleH,fill:bodyColor,stroke:'#111','stroke-width':2.5}));
  lines.forEach((ln,i)=>{
    const ty = y+titleH+pad+(i+0.72)*lineH;
    const txt = e('text',{x:x+12,y:ty,'font-size':12.5,fill:'#111','font-family':'monospace'});
    txt.textContent = ln;
    svg.appendChild(txt);
  });
  return {
    x,y,w,h,titleH,lineH,pad,
    anchorRight:(i)=>({x:x+w, y:y+titleH+pad+(i+0.5)*lineH}),
    anchorLeft:(i)=>({x, y:y+titleH+pad+(i+0.5)*lineH}),
    anchorBottom:()=>({x:x+w/2, y:y+h}),
    anchorTop:()=>({x:x+w/2, y})
  };
}
function arrow(svg, p1, p2, color, dashed){
  const id = color==='#f4a93b'?'a':color==='#c8534f'?'b':color==='#e0524a'?'blocked':'sh';
  const el = e('path',{d:`M${p1.x},${p1.y} L${p2.x},${p2.y}`, stroke:color, 'stroke-width':3, fill:'none', 'marker-end':`url(#arrow-${id})`});
  if(dashed) el.setAttribute('stroke-dasharray','7,5');
  svg.appendChild(el);
}

/* ---- tiny syntax highlighter for the full-code blocks ---- */
function highlight(code){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  code = esc(code);
  const pattern = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\bstd::[A-Za-z_][A-Za-z0-9_]*\b)|(\b(?:void|int|bool|double|float|long|char|class|struct|template|typename|return|if|else|while|for|do|using|namespace|const|auto|true|false|static|constexpr|public|private|protected|virtual|override|new|delete|try|catch|throw|switch|case|break|continue|sizeof|nullptr|this|thread_local|inline)\b)/g;
  return code.replace(pattern, (m, comment, str, stdtok, kw) => {
    if (comment) return `<span class="c-comment">${comment}</span>`;
    if (str) return `<span class="c-str">${str}</span>`;
    if (stdtok) return `<span class="c-std">${stdtok}</span>`;
    if (kw) return `<span class="c-kw">${kw}</span>`;
    return m;
  });
}

function renderScenario(container, spec){
  container.innerHTML = `<div class="scenario">
    <h2>${spec.title}</h2>
    <div class="desc">${spec.desc}</div>
    <svg viewBox="0 0 1000 ${spec.svgH}"></svg>
    <ol class="steps">${spec.steps.map((s,i)=>`<li><span class="num">${i+1}</span>${s}</li>`).join('')}</ol>
    ${spec.note?`<div class="note">${spec.note}</div>`:''}
    <div class="codewrap">
      <button class="toggle-code">Show full compilable example \u25b8</button>
      <pre class="fullcode" style="display:none"><code>${highlight(spec.fullCode.trim())}</code></pre>
    </div>
  </div>`;
  const svg = container.querySelector('svg');
  addDefs(svg,[{id:'a',color:'#f4a93b'},{id:'b',color:'#c8534f'},{id:'blocked',color:'#e0524a'},{id:'sh',color:'#5b6b7c'}]);
  spec.draw(svg, codeBox, arrow);

  const btn = container.querySelector('.toggle-code');
  const pre = container.querySelector('.fullcode');
  btn.addEventListener('click', () => {
    const open = pre.style.display !== 'none';
    pre.style.display = open ? 'none' : 'block';
    btn.textContent = open ? 'Show full compilable example \u25b8' : 'Hide full compilable example \u25be';
  });
}

const CN = ['\u2460','\u2461','\u2462','\u2463','\u2464','\u2465','\u2466','\u2467'];
const scenarios = {};

/* ================= 0. std::thread basics ================= */
scenarios.thread_basics = {
  tab: 'std::thread',
  title: 'std::thread — creating, joining, detaching',
  desc: 'The foundation everything else builds on: launching a function on a new OS thread, passing arguments, and the join-vs-detach decision.',
  svgH: 420,
  steps: [
    '<b>Main</b> constructs <code class="inline">thread t1(worker, 1, 100)</code> — the function and its arguments are copied into the thread\'s storage, and it starts running <b>immediately</b>, not on join().',
    'Main constructs <code class="inline">thread t2</code> from a lambda — also starts running concurrently right away.',
    'Main calls <code class="inline">t2.detach()</code> — releases ownership. t2 keeps running independently; main can no longer join or observe it.',
    'Main calls <code class="inline">t1.join()</code> — blocks until t1\'s function returns.',
    'Inside the new thread, <code class="inline">worker(1, 100)</code> actually runs — with its own copies of the arguments passed at construction.'
  ],
  note: '<b>Forgetting</b> to either join() or detach() a joinable thread before its destructor runs calls <code class="inline">std::terminate()</code> and kills the whole program — this is the single most common std::thread bug (fixed by <code class="inline">jthread</code>, covered later).',
  draw(svg, codeBox, arrow){
    const A = codeBox(svg,{x:15,y:60,w:320,title:'Main thread',titleColor:'#f4a93b',lines:[
      'void main() {',
      `  ${CN[0]} thread t1(worker, 1, 100);`,
      `  ${CN[1]} thread t2(logger_task);`,
      `  ${CN[2]} t2.detach();`,
      `  ${CN[3]} t1.join();`,
      '}'
    ]});
    const B = codeBox(svg,{x:665,y:60,w:320,title:'worker() — runs on t1',titleColor:'#c8534f',lines:[
      'void worker(int id, int value) {',
      `  ${CN[4]} process(id, value);`,
      '}'
    ]});
    const M = codeBox(svg,{x:340,y:250,w:320,title:'thread facts',titleColor:'#5b6b7c',titleTextColor:'#fff',bodyColor:'#c7d3de',lines:[
      'hardware_concurrency() -> sizing hint',
      't2: detached, no longer joinable'
    ]});
    arrow(svg, A.anchorRight(1), B.anchorLeft(0), '#f4a93b');
    arrow(svg, A.anchorRight(2), M.anchorTop(), '#f4a93b', true);
  },
  fullCode: `
#include <iostream>
#include <thread>

void worker(int id, int value) {
    std::cout << "Worker " << id << " processing " << value << '\\n';
}

int main() {
    unsigned n = std::thread::hardware_concurrency();
    std::cout << n << " hardware threads available\\n";

    std::thread t1(worker, 1, 100);      // args copied into the thread's storage

    std::thread t2([] {
        std::cout << "Detached logger running independently\\n";
    });
    t2.detach();                          // no longer joinable; runs on its own

    if (t1.joinable()) t1.join();         // wait for t1 to finish

    std::cout << "Main thread id: " << std::this_thread::get_id() << '\\n';
}
`
};

/* ================= 1. mutex + lock_guard ================= */
scenarios.mutex = {
  tab: 'mutex + lock_guard',
  title: 'std::mutex — exclusive access with std::lock_guard',
  desc: 'Two threads increment a shared counter. Thread A uses RAII (lock_guard); Thread B locks/unlocks manually so you can see the difference.',
  svgH: 420,
  steps: [
    '<b>Thread A</b> constructs <code class="inline">lock_guard&lt;mutex&gt; lk(mtx)</code> — this calls <code class="inline">mtx.lock()</code> in the constructor.',
    'A is now inside its critical section and safely increments <code class="inline">shared_counter</code>.',
    'A\'s <code class="inline">lock_guard</code> goes out of scope → its destructor calls <code class="inline">mtx.unlock()</code> automatically, even if an exception was thrown.',
    'Meanwhile <b>Thread B</b> called <code class="inline">mtx.lock()</code> directly. Since A already owned the mutex, B <b>blocks here</b> until step 3 completes.',
    'B now owns the mutex and increments the counter.',
    'B must remember to call <code class="inline">mtx.unlock()</code> itself — nothing releases it automatically if B forgets or an exception fires.'
  ],
  note: '<b>Takeaway:</b> lock_guard trades flexibility for safety — it can\'t unlock early or be default-constructed, but it can never leak a lock. Prefer it whenever the whole scope is the critical section.',
  draw(svg, codeBox, arrow){
    const A = codeBox(svg,{x:20,y:60,w:290,title:'Thread A',titleColor:'#f4a93b',lines:[
      'void threadA() {',
      `  ${CN[0]} lock_guard<mutex> lk(mtx);`,
      `  ${CN[1]} shared_counter++;`,
      `  ${CN[2]} // scope ends -> auto unlock`,
      '}'
    ]});
    const B = codeBox(svg,{x:690,y:60,w:290,title:'Thread B',titleColor:'#c8534f',lines:[
      'void threadB() {',
      `  ${CN[3]} mtx.lock();`,
      `  ${CN[4]} shared_counter++;`,
      `  ${CN[5]} mtx.unlock();`,
      '}'
    ]});
    const M = codeBox(svg,{x:365,y:150,w:270,title:'std::mutex mtx',titleColor:'#5b6b7c',titleTextColor:'#fff',bodyColor:'#c7d3de',lines:[
      'state: unlocked',
      '  -> owned by A  (1,2,3)',
      '  -> owned by B  (4,5,6)'
    ]});
    arrow(svg, A.anchorRight(1), M.anchorLeft(1), '#f4a93b');
    arrow(svg, M.anchorLeft(1), A.anchorRight(2), '#f4a93b');
    arrow(svg, B.anchorLeft(1), M.anchorRight(1), '#c8534f', true);
    arrow(svg, M.anchorRight(1), B.anchorLeft(2), '#c8534f');
  },
  fullCode: `
#include <iostream>
#include <thread>
#include <mutex>

class Counter {
public:
    void incrementSafe() {
        std::lock_guard<std::mutex> lk(mtx_);   // locks on construction
        ++value_;
    }                                            // unlocks here (RAII)

    void incrementManual() {
        mtx_.lock();
        ++value_;
        mtx_.unlock();                            // must remember this!
    }

    int value() const { return value_; }

private:
    std::mutex mtx_;
    int value_ = 0;
};

int main() {
    Counter counter;
    std::thread a([&] { for (int i = 0; i < 100000; ++i) counter.incrementSafe(); });
    std::thread b([&] { for (int i = 0; i < 100000; ++i) counter.incrementManual(); });
    a.join();
    b.join();
    std::cout << "Final value: " << counter.value() << '\\n'; // always 200000
}
`
};

/* ================= 2. unique_lock ================= */
scenarios.unique_lock = {
  tab: 'unique_lock',
  title: 'std::unique_lock — deferred, manual, and early-unlock control',
  desc: 'unique_lock is the flexible RAII wrapper: you can delay locking, unlock mid-scope, and relock — none of which lock_guard allows.',
  svgH: 460,
  steps: [
    '<b>Producer</b> constructs <code class="inline">unique_lock&lt;mutex&gt; lk(mtx, std::defer_lock)</code> — the mutex is <b>not</b> locked yet.',
    'It does expensive prep work while the mutex stays free for anyone else.',
    'It calls <code class="inline">lk.lock()</code> explicitly, now entering the critical section.',
    'It pushes the prepared item onto the shared queue.',
    'It calls <code class="inline">lk.unlock()</code> <b>before</b> the loop\'s next iteration, shrinking the critical section on purpose.',
    'Loop repeats — prep work happens with the mutex free again.',
    '<b>Consumer</b> (plain lock_guard) grabs the mutex whenever it\'s free and reads the queue.'
  ],
  note: '<b>lock_guard vs unique_lock:</b> unique_lock is heavier (it tracks ownership state at runtime) but is the only option that works with <code class="inline">std::condition_variable::wait</code>, which needs to unlock while sleeping and relock on wakeup.',
  draw(svg, codeBox, arrow){
    const A = codeBox(svg,{x:15,y:60,w:330,title:'Producer',titleColor:'#f4a93b',lines:[
      'void producer() {',
      `  ${CN[0]} unique_lock<mutex> lk(mtx, defer_lock);`,
      `  ${CN[1]} int item = prepare();`,
      `  ${CN[2]} lk.lock();`,
      `  ${CN[3]} sharedQueue.push_back(item);`,
      `  ${CN[4]} lk.unlock();`,
      '}'
    ]});
    const B = codeBox(svg,{x:670,y:220,w:310,title:'Consumer',titleColor:'#c8534f',lines:[
      'void consumer() {',
      `  ${CN[6]} lock_guard<mutex> lk(mtx);`,
      '     read(sharedQueue);',
      '}'
    ]});
    const M = codeBox(svg,{x:355,y:60,w:290,title:'std::mutex mtx',titleColor:'#5b6b7c',titleTextColor:'#fff',bodyColor:'#c7d3de',lines:[
      'unlocked  (during 1,2)',
      'owned by producer  (during 3,4)',
      'unlocked  (during 5,6)',
      'owned by consumer  (during 7)'
    ]});
    arrow(svg, A.anchorRight(2), M.anchorLeft(1), '#f4a93b');
    arrow(svg, A.anchorRight(4), M.anchorLeft(2), '#f4a93b');
    arrow(svg, M.anchorLeft(2), A.anchorRight(4), '#f4a93b');
    arrow(svg, B.anchorLeft(1), M.anchorLeft(3), '#c8534f');
  },
  fullCode: `
#include <iostream>
#include <thread>
#include <mutex>
#include <vector>
#include <chrono>

std::mutex mtx;
std::vector<int> sharedQueue;

void producer() {
    std::unique_lock<std::mutex> lk(mtx, std::defer_lock); // not locked yet
    for (int i = 0; i < 5; ++i) {
        int item = i * i;                 // expensive prep work, done unlocked
        std::this_thread::sleep_for(std::chrono::milliseconds(20));

        lk.lock();
        sharedQueue.push_back(item);
        lk.unlock();                       // release early, keep prep work outside the lock
    }
}

void consumer() {
    std::lock_guard<std::mutex> lk(mtx);
    for (int v : sharedQueue) std::cout << v << ' ';
    std::cout << '\\n';
}

int main() {
    std::thread p(producer);
    p.join();
    consumer();
}
`
};

/* ================= 3. recursive_mutex ================= */
scenarios.recursive = {
  tab: 'recursive_mutex',
  title: 'std::recursive_mutex — same thread, nested locking',
  desc: 'A function that calls itself (or calls another function that also needs the lock) while already holding it — this is exactly the case that deadlocks a plain std::mutex.',
  svgH: 400,
  steps: [
    '<b>Thread A</b> calls <code class="inline">logError()</code>, which locks the recursive mutex — internal owner count becomes <b>1</b>.',
    'logError() calls log() internally.',
    '<code class="inline">log()</code> locks the <b>same</b> recursive mutex from the <b>same thread</b> — this succeeds and count becomes <b>2</b>. (A plain <code class="inline">std::mutex</code> would block forever here.)',
    'log() finishes and unlocks — count drops to <b>1</b>. The mutex is still considered locked.',
    'logError() unlocks — count drops to <b>0</b>. Only now is the mutex actually free for other threads.'
  ],
  note: '<b>Rule of thumb:</b> needing recursive_mutex is often a sign the code\'s locking boundaries aren\'t clean. It solves self-deadlock, but a redesign that locks once at the outermost call is usually better.',
  draw(svg, codeBox, arrow){
    const A = codeBox(svg,{x:60,y:60,w:340,title:'Thread A: logger.logError()',titleColor:'#f4a93b',lines:[
      'void logError(msg) {',
      `  ${CN[0]} lock_guard<recursive_mutex> lk(mtx_);`,
      `  ${CN[1]} log("[ERROR] " + msg);`,
      '}'
    ]});
    const I = codeBox(svg,{x:600,y:60,w:340,title:'log() — same thread',titleColor:'#f4a93b',lines:[
      'void log(msg) {',
      `  ${CN[2]} lock_guard<recursive_mutex> lk(mtx_);`,
      '     cout << msg;',
      `  ${CN[3]} // scope ends, count 2->1`,
      '}'
    ]});
    const M = codeBox(svg,{x:330,y:250,w:340,title:'std::recursive_mutex mtx_',titleColor:'#5b6b7c',titleTextColor:'#fff',bodyColor:'#c7d3de',lines:[
      `owner: Thread A   count: 1 -> 2 -> 1 -> 0  ${CN[4]}`
    ]});
    arrow(svg, A.anchorBottom(), M.anchorTop(), '#f4a93b');
    arrow(svg, I.anchorBottom(), M.anchorTop(), '#f4a93b');
  },
  fullCode: `
#include <iostream>
#include <thread>
#include <mutex>
#include <string>

class Logger {
public:
    void logError(const std::string& msg) {
        std::lock_guard<std::recursive_mutex> lk(mtx_);
        log("[ERROR] " + msg);      // calls log(), which locks again on the SAME thread
    }

    void log(const std::string& msg) {
        std::lock_guard<std::recursive_mutex> lk(mtx_);  // re-entrant: succeeds, count 1->2
        std::cout << msg << '\\n';
    }

private:
    std::recursive_mutex mtx_;
};

int main() {
    Logger logger;
    std::thread t1([&] { logger.logError("disk full"); });
    std::thread t2([&] { logger.log("startup complete"); });
    t1.join();
    t2.join();
}
`
};

/* ================= 4. timed_mutex ================= */
scenarios.timed = {
  tab: 'timed_mutex',
  title: 'std::timed_mutex — give up instead of blocking forever',
  desc: 'try_lock_for()/try_lock_until() let a thread bail out with a fallback plan instead of waiting indefinitely.',
  svgH: 400,
  steps: [
    '<b>Thread A</b> locks the timed mutex and holds it for a long operation (simulated 2s critical section).',
    '<b>Thread B</b> calls <code class="inline">dbLock.try_lock_for(500ms)</code> instead of <code class="inline">lock()</code>.',
    '500ms pass and A still hasn\'t released — <code class="inline">try_lock_for</code> returns <b>false</b>.',
    'B takes the <b>fallback branch</b> (queueing the request for later) instead of blocking.',
    'A finally finishes and unlocks — but B already moved on and isn\'t waiting for it.'
  ],
  note: '<b>recursive_timed_mutex</b> combines this timeout behavior with the same-thread re-entry from the previous tab. <b>shared_timed_mutex</b> combines it with the reader/writer behavior in the next tab, via <code class="inline">try_lock_shared_for()</code>. <code class="inline">try_lock_until()</code> works identically but takes an absolute <code class="inline">time_point</code> instead of a duration.',
  draw(svg, codeBox, arrow){
    const A = codeBox(svg,{x:20,y:60,w:300,title:'Thread A',titleColor:'#f4a93b',lines:[
      'void longQuery() {',
      `  ${CN[0]} lock_guard<timed_mutex> lk(dbLock);`,
      '     sleep_for(2s);  // simulate slow query',
      '}'
    ]});
    const B = codeBox(svg,{x:680,y:60,w:300,title:'Thread B',titleColor:'#c8534f',lines:[
      'void quickAttempt() {',
      `  ${CN[1]} if (dbLock.try_lock_for(500ms)) {`,
      '       // acquired',
      '     } else {',
      `  ${CN[3]}   queueForLater();  // gave up`,
      '     }',
      '}'
    ]});
    const M = codeBox(svg,{x:355,y:220,w:290,title:'std::timed_mutex dbLock',titleColor:'#5b6b7c',titleTextColor:'#fff',bodyColor:'#c7d3de',lines:[
      'owned by A for ~2s',
      `${CN[2]}  B\u2019s 500ms window expires first`
